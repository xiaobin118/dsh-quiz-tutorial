name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax + bundle sync
        run: npm run check
      - name: Host/client regression tests
        run: npm test
      - name: Bundled decks match the generator
        run: python3 tools/gen_decks.py --check
